<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Connection | Kyanbrix</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #181818;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 380px;
            width: 90%;
        }
        .status-icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        p { color: #b3b3b3; font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon" class="status-icon">⏳</div>
        <h1 id="title">Connecting Spotify...</h1>
        <p id="message">Please wait while we link your account and send your stats to Discord.</p>
    </div>

    <script>
        // Update this URL whenever your quick tunnel restarts
        const TUNNEL_URL = "https://adventures-recreation-fin-aaron.trycloudflare.com";

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        if (code && state) {
            fetch(`${TUNNEL_URL}/api/spotify/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`)
                .then(response => {
                    if (response.ok) {
                        document.getElementById('icon').innerText = "🎉";
                        document.getElementById('title').innerText = "Spotify Connected!";
                        document.getElementById('message').innerText = "Your top tracks have been sent directly to your Discord channel. You can safely close this tab.";
                    } else {
                        throw new Error("Failed authorization");
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('icon').innerText = "❌";
                    document.getElementById('title').innerText = "Connection Failed";
                    document.getElementById('message').innerText = "Could not link Spotify. Please check if the bot is online and try the slash command again.";
                });
        } else {
            document.getElementById('icon').innerText = "⚠️";
            document.getElementById('title').innerText = "Invalid Request";
            document.getElementById('message').innerText = "No authorization parameters were found in the URL.";
        }
    </script>
</body>
</html>
