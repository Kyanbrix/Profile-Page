    // Decode a photo into a canvas of white pixels whose alpha is the letter brightness
    async function loadPhoto(src) {
        const img = new Image();
        img.src = src;
        await img.decode();

        const photo = document.createElement('canvas');
        photo.width = img.naturalWidth;
        photo.height = img.naturalHeight;
        const photoCtx = photo.getContext('2d');
        photoCtx.drawImage(img, 0, 0);

        const pixels = photoCtx.getImageData(0, 0, photo.width, photo.height);
        const d = pixels.data;
        for (let i = 0; i < d.length; i += 4) {
            const brightness = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
            const alpha = Math.max(MIN_ALPHA, Math.min(1, Math.pow(brightness, 0.75) * 1.15));
            d[i] = d[i + 1] = d[i + 2] = 255;
            d[i + 3] = Math.round(alpha * 255);
        }
        photoCtx.putImageData(pixels, 0, 0);
        return photo;
    }

    const volume = player;
    volume.volume = 0.2;

    enterBtn.addEventListener('click', () => {
        volume.play();
        splashScreen.style.opacity = '0';

        setTimeout(() => {
            splashScreen.style.display = 'none';
        }, 500);
    });

    // The wall of letters, and one pixel per letter holding its brightness
    const textLayer = document.createElement('canvas');
    const textCtx = textLayer.getContext('2d');
    const cellLayer = document.createElement('canvas');
    const cellCtx = cellLayer.getContext('2d');

    let photos = [];
    let dpr = 1;
    let viewW = 0;
    let viewH = 0;
    let cellW = 0;
    let cellH = 0;
    let cols = 0;
    let rows = 0;
    let resizeQueued = false;
    let renderQueued = false;

    // zoom 1 = photo just covers the screen; px/py = which part of it is in view (0..1)
    const view = { zoom: 1, px: 0.5, py: FOCUS_Y };

    function resizeAndDraw() {
        viewW = canvas.clientWidth;
        viewH = canvas.clientHeight;
        if (!viewW || !viewH) return;
        // Stay under the canvas size limit of mobile browsers
        const areaCap = Math.sqrt(MAX_CANVAS_PIXELS / (viewW * viewH));
        dpr = Math.min(window.devicePixelRatio || 1, areaCap);
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        buildTextLayer();
        render();
    }

    function queueResize() {
        if (resizeQueued) return;
        resizeQueued = true;
        requestAnimationFrame(() => {
            resizeQueued = false;
            resizeAndDraw();
        });
    }

    function requestRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
            renderQueued = false;
            render();
        });
    }

    // Letters are drawn once per screen size; zooming only changes how bright each one is
    function buildTextLayer() {
        textLayer.width = canvas.width;
        textLayer.height = canvas.height;
        textCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        textCtx.font = `bold 100px ${FONT_STACK}`;
        const charAspect = textCtx.measureText('M').width / 100;
        const fontSize = Math.max(
            MIN_FONT_DEVICE_PX / dpr,
            Math.min(FONT_PX, viewW / (MIN_COLS * charAspect))
        );
        cellW = fontSize * charAspect;
        cellH = fontSize * LINE_HEIGHT;
        cols = Math.ceil(viewW / cellW);
        rows = Math.ceil(viewH / cellH);
        cellLayer.width = cols;
        cellLayer.height = rows;

        textCtx.font = `bold ${fontSize}px ${FONT_STACK}`;
        textCtx.textBaseline = 'top';
        textCtx.textAlign = 'left';
        textCtx.fillStyle = '#fff';

        const phraseLen = PHRASE.length;
        let charIndex = 0;
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                textCtx.fillText(PHRASE[charIndex % phraseLen], col * cellW, row * cellH);
                charIndex++;
            }
        }
    }

    // Where the current photo sits on screen for the current zoom and pan
    function photoPlacement() {
        const photo = photos[currentIndex];
        // The letter grid overhangs the screen by up to one cell, so cover the grid
        const gridW = cols * cellW;
        const gridH = rows * cellH;
        const scale = Math.max(gridW / photo.width, gridH / photo.height) * view.zoom;
        return {
            photo, gridW, gridH, scale,
            x: (gridW - photo.width * scale) * view.px,
            y: (gridH - photo.height * scale) * view.py,
        };
    }

    // Move the photo's top-left corner to (x, y), never uncovering the screen
    function placePhoto(p, x, y) {
        const slackX = p.gridW - p.photo.width * p.scale;
        const slackY = p.gridH - p.photo.height * p.scale;
        if (slackX < -1e-6) view.px = Math.max(0, Math.min(1, x / slackX));
        if (slackY < -1e-6) view.py = Math.max(0, Math.min(1, y / slackY));
    }

    function render() {
        if (!photos.length || !cols) return;
        const p = photoPlacement();

        // Shrink the visible part of the photo to one pixel per letter
        cellCtx.globalCompositeOperation = 'copy';
        cellCtx.imageSmoothingQuality = 'high';
        cellCtx.drawImage(
            p.photo,
            -p.x / p.scale, -p.y / p.scale, p.gridW / p.scale, p.gridH / p.scale,
            0, 0, cols, rows
        );

        // Blow it back up as flat blocks, then keep only the letter shapes
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.globalCompositeOperation = 'copy';
        ctx.drawImage(cellLayer, 0, 0, p.gridW, p.gridH);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(textLayer, 0, 0);
    }

    // Zoom the photo, keeping the point under (sx, sy) where it is
    function zoomAt(sx, sy, factor) {
        if (!photos.length) return;
        const zoom = Math.max(1, Math.min(MAX_ZOOM, view.zoom * factor));
        if (zoom === view.zoom) return;
        const before = photoPlacement();
        const photoX = (sx - before.x) / before.scale;
        const photoY = (sy - before.y) / before.scale;
        view.zoom = zoom;
        const after = photoPlacement();
        placePhoto(after, sx - photoX * after.scale, sy - photoY * after.scale);
        scheduleChange();
        requestRender();
    }

    function panBy(dx, dy) {
        if (!photos.length) return;
        const p = photoPlacement();
        placePhoto(p, p.x + dx, p.y + dy);
        scheduleChange();
        requestRender();
    }

    function resetView() {
        view.zoom = 1;
        view.px = 0.5;
        view.py = FOCUS_Y;
        scheduleChange();
        requestRender();
    }

    const pointers = new Map();
    let lastPointer = null;
    let pinchDistance = 0;
    let lastTapTime = 0;
    let changeTimer = 0;

    // The delay counts from the last time someone moved or zoomed the photo
    function scheduleChange() {
        clearTimeout(changeTimer);
        changeTimer = setTimeout(changeImage, CHANGE_DELAY);
    }

    function changeImage() {
        scheduleChange();
        // Leave the photo alone while someone is looking around it
        if (!photos.length || view.zoom > 1 || pointers.size) return;
        currentIndex = (currentIndex + 1) % photos.length;
        resetView();
    }

    scheduleChange();

    // Ctrl + wheel and trackpad pinch would zoom the page, which resizes the letters
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const speed = e.ctrlKey ? 0.01 : 0.002;
        const limit = e.ctrlKey ? 30 : 150;
        const delta = (e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY);
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.max(-limit, Math.min(limit, delta)) * speed));
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
        if (!e.ctrlKey && !e.metaKey) return;
        const at = lastPointer || { x: viewW / 2, y: viewH / 2 };
        if (e.key === '+' || e.key === '=') zoomAt(at.x, at.y, 1.25);
        else if (e.key === '-' || e.key === '_') zoomAt(at.x, at.y, 1 / 1.25);
        else if (e.key === '0') resetView();
        else return;
        e.preventDefault();
    });

    canvas.addEventListener('pointerdown', (e) => {
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const [a, b] = [...pointers.values()];
        pinchDistance = pointers.size === 2 ? Math.hypot(a.x - b.x, a.y - b.y) : 0;

        if (e.pointerType === 'touch' && pointers.size === 1) {
            const now = performance.now();
            if (now - lastTapTime < 300) resetView();
            lastTapTime = now;
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        lastPointer = { x: e.clientX, y: e.clientY };
        const previous = pointers.get(e.pointerId);
        if (!previous) return;
        pointers.set(e.pointerId, lastPointer);

        if (pointers.size === 1) {
            panBy(e.clientX - previous.x, e.clientY - previous.y);
        } else if (pointers.size === 2) {
            const [a, b] = [...pointers.values()];
            const distance = Math.hypot(a.x - b.x, a.y - b.y);
            // The midpoint moves half as far as the finger that moved
            panBy((e.clientX - previous.x) / 2, (e.clientY - previous.y) / 2);
            if (pinchDistance) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, distance / pinchDistance);
            pinchDistance = distance;
        }
    });

    function releasePointer(e) {
        pointers.delete(e.pointerId);
        pinchDistance = 0;
    }

    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', releasePointer);
    canvas.addEventListener('dblclick', resetView);

    // Zoom or a move to another monitor can change the pixel ratio without a resize
    function watchPixelRatio() {
        matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change', () => {
            queueResize();
            watchPixelRatio();
        }, { once: true });
    }

    window.addEventListener('resize', queueResize);
    watchPixelRatio();
    resizeAndDraw();

    Promise.all(PHOTO_SOURCES.map(loadPhoto)).then((loaded) => {
        photos = loaded;
        loadingEl.style.display = 'none';
        render();
    });
</script>

</body>
</html>
