    function base64ToUint8Array(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }

    const DECODED_GRIDS = IMAGE_GRIDS.map(g => ({
        w: g.w,
        h: g.h,
        data: base64ToUint8Array(g.b64)
    }));

    loadingEl.style.display = 'none';

    const volume = player;
    volume.volume = 0.2;

    enterBtn.addEventListener('click', () => {
        volume.play();
        splashScreen.style.opacity = '0';

        setTimeout(() => {
            splashScreen.style.display = 'none';
        }, 500);
    });

    function resizeAndDraw() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawMosaic();
    }

    function changeImage() {
        currentIndex = (currentIndex + 1) % DECODED_GRIDS.length;
        drawMosaic();
    }

    setInterval(changeImage, 5000);

    function drawMosaic() {
        const w = canvas.width;
        const h = canvas.height;
        const grid = DECODED_GRIDS[currentIndex];
        const GRID_W = grid.w;
        const GRID_H = grid.h;
        const data = grid.data;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const scale = Math.max(w / GRID_W, h / GRID_H);
        const scaledW = GRID_W * scale;
        const scaledH = GRID_H * scale;
        const offsetX = (w - scaledW) / 2;
        const offsetY = (h - scaledH) / 2;

        const diagonal = Math.sqrt(w * w + h * h);
        const fontSize = Math.max(6, Math.min(15, diagonal / 170));
        const cellW = fontSize * 0.62;
        const cellH = fontSize * 1.05;

        const cols = Math.ceil(w / cellW);
        const rows = Math.ceil(h / cellH);

        ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';

        let charIndex = 0;
        const phraseLen = PHRASE.length;

        for (let row = 0; row < rows; row++) {
            const py = row * cellH + cellH / 2;
            let giy = Math.floor((py - offsetY) / scale);
            giy = Math.max(0, Math.min(GRID_H - 1, giy));

            for (let col = 0; col < cols; col++) {
                const px = col * cellW + cellW / 2;
                let gix = Math.floor((px - offsetX) / scale);
                gix = Math.max(0, Math.min(GRID_W - 1, gix));

                const brightness = data[giy * GRID_W + gix] / 255;
                let alpha = Math.pow(brightness, 0.75);
                alpha = Math.min(1, alpha * 1.15);

                if (alpha > 0.03) {
                    const ch = PHRASE[charIndex % phraseLen];
                    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
                    ctx.fillText(ch, col * cellW, row * cellH);
                }
                charIndex++;
            }
        }
    }

    window.addEventListener('resize', resizeAndDraw);
    resizeAndDraw();
</script>
